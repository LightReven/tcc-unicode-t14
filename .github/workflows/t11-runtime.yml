name: T11 Runtime Metadata

on:
  workflow_dispatch:

jobs:
  runtime-validation:
    if: github.ref != 'refs/heads/main'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime
        shell: powershell
        run: |
          node --version
          npm --version
          whoami

      - name: Install
        shell: powershell
        run: npm ci

      - name: Library tests
        shell: powershell
        run: npm --prefix .\packages\runtime-metadata test

      - name: Syntax validation
        shell: powershell
        run: npm run check

      - name: Defender status
        shell: powershell
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,BehaviorMonitorEnabled,IoavProtectionEnabled,NISEnabled,AntivirusSignatureVersion,AMRunningMode

      - name: T11 runtime
        shell: powershell
        run: node .\app.js

      - name: Evidence
        shell: powershell
        run: Get-Content .\t11_result.txt

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: t11-evidence
          path: t11_result.txt